    {n:"于禁",z:"文則",f:"曹魏",b:null,d:221,title:"左將軍",bio:"五子良將之一，樊城水淹七軍後降關羽，晚節不保。"},
    {n:"樂進",z:"文謙",f:"曹魏",b:null,d:218,title:"右將軍",bio:"先登陷陣，以驍果顯，五子良將之一。"},
    {n:"許褚",z:"仲康",f:"曹魏",b:null,d:null,title:"武衛將軍",bio:"虎癡。赤膊上陣，裸衣鬥馬超，曹操貼身護衛。"},
    {n:"典韋",z:"",f:"曹魏",b:null,d:197,title:"都尉",bio:"古之惡來。宛城之變，以寡敵眾護曹操退走，力竭而死。"},
    {n:"郭嘉",z:"奉孝",f:"曹魏",b:170,d:207,title:"軍師祭酒",bio:"鬼才。算無遺策，早卒。曹操哭曰：奉孝在，不使孤至此。"},
    {n:"荀彧",z:"文若",f:"曹魏",b:163,d:212,title:"尚書令",bio:"王佐之才。為曹操規劃奉天子之策，後以反對進爵魏公見疏，憂死。"},
    {n:"荀攸",z:"公達",f:"曹魏",b:157,d:214,title:"尚書令",bio:"算無遺策，曹操謀主，與荀彧並稱二荀。"},
    {n:"賈詡",z:"文和",f:"曹魏",b:147,d:223,title:"太尉",bio:"毒士。歷事董卓、張繡、曹操，明哲保身，壽終正寢。"},
    {n:"程昱",z:"仲德",f:"曹魏",b:141,d:220,title:"衛尉",bio:"性剛戾，多謀斷，曹操拔為心腹。"},
    {n:"司馬懿",z:"仲達",f:"曹魏",b:179,d:251,title:"魏太傅",bio:"鷹視狼顧，忍而多疑。禦諸葛亮於渭水，誅曹爽於高平陵，為晉奠基。"},
    {n:"司馬昭",z:"子上",f:"曹魏",b:211,d:265,title:"晉文帝（追尊）",bio:"弑君專權，滅蜀漢。其心路人皆知。"},
    {n:"鄧艾",z:"士載",f:"曹魏",b:197,d:264,title:"征西將軍",bio:"偷渡陰平，滅蜀第一功，後遭誣陷被殺。"},
    {n:"鍾會",z:"士季",f:"曹魏",b:225,d:264,title:"司徒",bio:"伐蜀主帥，才兼文武，功成後謀反被殺。"},
    {n:"孫堅",z:"文台",f:"江東孫氏",b:155,d:191,title:"破虜將軍",bio:"江東猛虎。討董卓先入洛陽得傳國玉璽，後為黃祖部將射殺。"},
    {n:"孫策",z:"伯符",f:"東吳",b:175,d:200,title:"討逆將軍",bio:"江東小霸王。轉戰江東，奠定吳基，遇刺早亡。"},
    {n:"孫權",z:"仲謀",f:"東吳",b:182,d:252,title:"吳大帝",bio:"生子當如孫仲謀。據江東，結劉抗曹於赤壁，後稱帝建吳。"},
    {n:"周瑜",z:"公瑾",f:"東吳",b:175,d:210,title:"大都督",bio:"赤壁火攻之帥，性度恢廓，通音律。演義以「三氣周瑜」塑其量窄。"},
    {n:"魯肅",z:"子敬",f:"東吳",b:172,d:217,title:"橫江將軍",bio:"老成持重，力主孫劉聯盟，接周瑜督軍。"},
    {n:"呂蒙",z:"子明",f:"東吳",b:178,d:220,title:"虎威將軍",bio:"吳下阿蒙，士別三日刮目相看。白衣渡江取荊州，擒關羽。"},
    {n:"陸遜",z:"伯言",f:"東吳",b:183,d:245,title:"丞相",bio:"火燒連營破劉備於夷陵，後為吳之上柱國，晚受孫權猜忌而亡。"},
    {n:"太史慈",z:"子義",f:"東吳",b:166,d:206,title:"折衝中郎將",bio:"神亭酣鬥小霸王，猿臂善射，為孫策所重。"},
    {n:"甘寧",z:"興霸",f:"東吳",b:null,d:null,title:"折衝將軍",bio:"錦帆賊。百騎劫魏營，江東虎臣之首。"},
    {n:"黃蓋",z:"公覆",f:"東吳",b:null,d:null,title:"武鋒中郎將",bio:"赤壁苦肉計之主角，年老而忠勇。"},
    {n:"張昭",z:"子布",f:"東吳",bio:"156",d:"236",title:"輔吳將軍",bio:"江東文臣之首，赤壁前主降，孫權以壁繩阻之。"},
    {n:"孫尚香",z:"",f:"東吳",b:null,d:null,title:"孫夫人",bio:"孫權之妹，嫁劉備，性剛勇，侍婢皆執刀。"},
    {n:"董卓",z:"仲穎",f:"董卓集團",b:null,d:192,title:"相國",bio:"西涼梟雄，進京廢少帝立獻帝，荒淫殘暴，終為呂布所誅。"},
    {n:"呂布",z:"奉先",f:"呂布集團",b:null,d:199,title:"溫侯",bio:"人中呂布，馬中赤兔。三姓家奴，反覆無常，白門樓被縊。"},
    {n:"貂蟬",z:"",f:"董卓集團",b:null,d:null,title:"—",bio:"演義四大美人之一，王允連環計之關鍵。正史無其名。"},
    {n:"袁紹",z:"本初",f:"袁紹集團",b:null,d:202,title:"大將軍",bio:"四世三公，兵多糧足，然外寬內忌。官渡之敗，悔不如田豐言。"},
    {n:"袁術",z:"公路",f:"群雄",b:null,d:199,title:"僭號仲家",bio:"得玉璽稱帝於壽春，眾叛親離，嘔血而死。"},
    {n:"劉表",z:"景升",f:"劉表集團",b:142,d:208,title:"荊州牧",bio:"漢室宗親，坐鎮荊州十九年，無四方之志。"},
    {n:"劉璋",z:"季玉",f:"群雄",b:null,d:220,title:"益州牧",bio:"闇弱之主，引劉備入川御張魯，反失益州。"},
    {n:"馬騰",z:"壽成",f:"群雄",b:null,d:212,title:"征西將軍",bio:"西涼軍閥，衣帶詔事洩遇害，子馬超起兵報仇。"},
    {n:"公孫瓚",z:"伯圭",f:"群雄",b:null,d:199,title:"前將軍",bio:"白馬義從，先與袁紹爭河北，終自焚於易京樓。"},
    {n:"張魯",z:"公祺",f:"張魯集團",b:null,d:null,title:"鎮南將軍",bio:"五斗米道師君，雄踞漢中三十年。"},
    {n:"陳宮",z:"公台",f:"呂布集團",b:null,d:198,title:"—",bio:"中牟釋曹操而共謀，後覺其奸，轉事呂布，白門樓就刑不屈。"},
    {n:"王允",z:"子師",f:"漢室",b:137,d:192,title:"司徒",bio:"設連環計誅董卓，然不善處涼州餘部，終為李傕所殺。"},
    {n:"華佗",z:"元化",f:"群雄",b:null,d:null,title:"神醫",bio:"刮骨療毒，欲為曹操開顱治風疾，反被下獄殺害。"},
    {n:"張角",z:"",f:"群雄",b:null,d:184,title:"天公將軍",bio:"太平道人，倡「蒼天已死，黃天當立」，掀起黃巾之亂。"},
    {n:"左慈",z:"元放",f:"群雄",b:null,d:null,title:"—",bio:"方士，戲曹操於宴席，擲杯化鳥而去。"},
    {n:"于吉",z:"",f:"群雄",b:null,d:null,title:"—",bio:"江東道士，治病濟人，為孫策所殺，遂有冤魂索命之說。"},
    {n:"陶謙",z:"恭祖",f:"群雄",b:132,d:194,title:"徐州牧",bio:"老邁州牧，三讓徐州於劉備。"},
    {n:"孔融",z:"文舉",f:"群雄",b:153,d:208,title:"北海相",bio:"讓梨之孔北海，名士之風，終為曹操所殺。"},
    {n:"何進",z:"遂高",f:"漢室",b:null,d:189,title:"大將軍",bio:"外戚屠戶，欲誅宦豎反被殺，遂啟董卓之亂。"}
  ],
  places: [
    {n:"洛陽",m:"河南洛陽",lat:34.62,lng:112.45,ty:"都城",d:"東漢首都，董卓焚城後殘破。"},
    {n:"長安",m:"陝西西安",lat:34.27,lng:108.95,ty:"都城",d:"董卓挾獻帝西遷之所，亦為曹魏西都。"},
    {n:"許昌",m:"河南許昌",lat:34.02,lng:113.85,ty:"都城",d:"曹操迎獻帝於此，為許都。"},
    {n:"鄴城",m:"河北臨漳",lat:36.35,lng:114.62,ty:"都城",d:"袁紹、曹操之根據地，銅雀臺所在。"},
    {n:"成都",m:"四川成都",lat:30.66,lng:104.06,ty:"都城",d:"蜀漢都城，天府之國。"},
    {n:"建業",m:"江蘇南京",lat:32.06,lng:118.80,ty:"都城",d:"孫權稱帝之都，石頭城。"},
    {n:"荊州",m:"湖北荊州",lat:30.35,lng:112.19,ty:"州郡",d:"兵家必爭之地，關羽失之而蜀勢衰。"},
    {n:"襄陽",m:"湖北襄陽",lat:32.01,lng:112.12,ty:"州郡",d:"荊州北門，劉表治所。"},
    {n:"樊城",m:"湖北襄陽",lat:32.05,lng:112.13,ty:"城邑",d:"關羽水淹七軍處。"},
    {n:"赤壁",m:"湖北赤壁",lat:29.72,lng:113.93,ty:"戰場",d:"周瑜火攻破曹之地，三分之始。"},
    {n:"官渡",m:"河南中牟",lat:34.72,lng:114.02,ty:"戰場",d:"曹操以少勝袁紹，一統北方之關鍵。"},
    {n:"合肥",m:"安徽合肥",lat:31.86,lng:117.28,ty:"城邑",d:"張遼八百破十萬，逍遙津威名。"},
    {n:"漢中",m:"陝西漢中",lat:33.08,lng:107.03,ty:"州郡",d:"蜀之門戶，黃忠定軍山立功。"},
    {n:"街亭",m:"甘肅秦安",lat:34.86,lng:105.68,ty:"關隘",d:"馬謖失守，首次北伐受挫。"},
    {n:"陳倉",m:"陝西寶雞",lat:34.36,lng:107.20,ty:"城邑",d:"郝昭拒諸葛，以寡守城。"},
    {n:"五丈原",m:"陝西岐山",lat:34.30,lng:107.62,ty:"戰場",d:"諸葛亮病逝之地，秋風星隕。"},
    {n:"白帝城",m:"重慶奉節",lat:31.02,lng:109.53,ty:"城邑",d:"劉備托孤之所。"},
    {n:"夷陵",m:"湖北宜昌",lat:30.70,lng:111.29,ty:"戰場",d:"陸遜火燒連營，蜀漢元氣大傷。"},
    {n:"下邳",m:"江蘇睢寧",lat:34.31,lng:117.94,ty:"城邑",d:"呂布殞命之白門樓處。"},
    {n:"徐州",m:"江蘇徐州",lat:34.26,lng:117.18,ty:"州郡",d:"陶謙讓與劉備之州。"},
    {n:"宛城",m:"河南南陽",lat:32.99,lng:112.53,ty:"城邑",d:"張繡降而復叛，典韋死於此。"},
    {n:"壽春",m:"安徽壽縣",lat:32.58,lng:116.79,ty:"城邑",d:"袁術僭號之都。"},
    {n:"江夏",m:"湖北武漢",lat:30.59,lng:114.30,ty:"郡",d:"劉琦、黃祖屯守之地。"},
    {n:"柴桑",m:"江西九江",lat:29.71,lng:116.00,ty:"城邑",d:"周瑜屯兵處，赤壁戰前調度。"},
    {n:"麥城",m:"湖北當陽",lat:30.82,lng:111.79,ty:"城邑",d:"關羽敗走之處。"},
    {n:"定軍山",m:"陝西勉縣",lat:33.15,lng:106.68,ty:"戰場",d:"黃忠陣斬夏侯淵。"},
    {n:"長坂坡",m:"湖北當陽",lat:30.82,lng:111.79,ty:"戰場",d:"趙雲單騎救主。"},
    {n:"潼關",m:"陝西潼關",lat:34.55,lng:110.25,ty:"關隘",d:"馬超與曹操相持之地。"},
    {n:"涿郡",m:"河北涿州",lat:39.49,lng:115.98,ty:"郡",d:"劉備故里，桃園結義處。"},
    {n:"陳留",m:"河南開封",lat:34.80,lng:114.31,ty:"郡",d:"曹操起兵之地。"}
  ],
  battles: [
    {n:"黃巾之亂",y:"184",p:"中原八州",a:"漢軍 vs 黃巾",r:"漢勝",d:"張角倡太平道起兵，劉關張等隨義軍鎮壓。亂後州郡割據。"},
    {n:"討董卓",y:"190",p:"虎牢關 · 洛陽",a:"關東聯軍 vs 董卓",r:"董卓西遷",d:"十八路諸侯會盟，呂布英勇無敵，聯軍貌合神離，終散。"},
    {n:"界橋之戰",y:"191",p:"河北界橋",a:"袁紹 vs 公孫瓚",r:"袁紹勝",d:"麴義先登破白馬義從，袁紹遂定河北之基。"},
    {n:"宛城之戰",y:"197",p:"宛城",a:"曹操 vs 張繡",r:"張繡勝",d:"張繡降而復叛，典韋、曹昂、曹安民死於亂軍。"},
    {n:"下邳之戰",y:"198",p:"下邳",a:"曹操 vs 呂布",r:"曹操勝",d:"淹下邳擒呂布，白門樓縊殺之，陳宮同死。"},
    {n:"官渡之戰",y:"200",p:"官渡",a:"曹操 vs 袁紹",r:"曹操勝",d:"火燒烏巢，以兩萬破十萬，北方大局遂定。"},
    {n:"長坂坡之戰",y:"208",p:"當陽長坂",a:"曹操 vs 劉備",r:"曹操勝",d:"劉備敗走，趙雲單騎救阿斗，張飛據水斷橋。"},
    {n:"赤壁之戰",y:"208",p:"赤壁",a:"孫劉聯軍 vs 曹操",r:"孫劉勝",d:"周瑜用火攻，黃蓋詐降，曹軍樓船盡焚，三分之勢成。"},
    {n:"合肥之戰",y:"215",p:"合肥",a:"張遼 vs 孫權",r:"曹魏勝",d:"八百破十萬，孫權險遭擒於逍遙津。"},
    {n:"潼關之戰",y:"211",p:"潼關",a:"曹操 vs 馬超",r:"曹操勝",d:"馬超殺得曹操割鬚棄袍，終為離間計所敗。"},
    {n:"定軍山之戰",y:"219",p:"定軍山",a:"劉備 vs 夏侯淵",r:"蜀勝",d:"黃忠居高臨下陣斬夏侯淵，漢中遂定。"},
    {n:"樊城之戰",y:"219",p:"樊城",a:"關羽 vs 曹仁",r:"相持",d:"水淹七軍威震華夏，後為呂蒙偷襲荊州而敗。"},
    {n:"夷陵之戰",y:"222",p:"夷陵",a:"劉備 vs 陸遜",r:"東吳勝",d:"陸遜火燒連營七百里，蜀漢精銳盡喪。"},
    {n:"街亭之戰",y:"228",p:"街亭",a:"馬謖 vs 張郃",r:"曹魏勝",d:"馬謖舍水上山，被張郃斷汲，首次北伐失利。"},
    {n:"五丈原之戰",y:"234",p:"五丈原",a:"諸葛亮 vs 司馬懿",r:"相持",d:"諸葛亮屯田渭濱，積勞成疾，隕於秋風。"},
    {n:"滅蜀之戰",y:"263",p:"隴西 · 劍閣",a:"鍾會 · 鄧艾 vs 蜀漢",r:"曹魏勝",d:"鄧艾偷渡陰平，劉禪出降，蜀亡。"},
    {n:"高平陵之變",y:"249",p:"洛陽",a:"司馬懿 vs 曹爽",r:"司馬勝",d:"司馬懿詐病賺曹爽，一朝奪權，魏祚暗移。"},
    {n:"晉滅吳之戰",y:"280",p:"長江中下游",a:"西晉 vs 東吳",r:"西晉勝",d:"王濬樓船下益州，金陵王氣黯然收，三國歸晉。"}
  ],
  events: [
    {n:"桃園三結義",y:"184",p:"涿郡",ps:"劉備·關羽·張飛",d:"三人於桃園結為異姓兄弟，誓同生死，開三國序幕。"},
    {n:"十常侍之亂",y:"189",p:"洛陽",ps:"何進·張讓",d:"宦官誅殺何進，袁紹等誅宦，董卓乘亂入京。"},
    {n:"孟德獻刀",y:"189",p:"洛陽",ps:"曹操·董卓·王允",d:"曹操假意獻刀欲誅董卓未果，逃亡途中發「寧教我負天下人」之語。"},
    {n:"三讓徐州",y:"194",p:"徐州",ps:"陶謙·劉備",d:"陶謙病篤，三讓徐州，劉備自此有基業。"},
    {n:"煮酒論英雄",y:"199",p:"許昌",ps:"曹操·劉備",d:"青梅煮酒，曹操指劉備為天下英雄，劉備借雷掩驚。"},
    {n:"千里走單騎",y:"200",p:"許昌—河北",ps:"關羽",d:"關羽掛印封金，護二嫂過五關斬六將，尋兄而去。"},
    {n:"三顧茅廬",y:"207",p:"隆中",ps:"劉備·諸葛亮",d:"劉備三訪草廬，諸葛亮隆中對，定三分之策。"},
    {n:"舌戰群儒",y:"208",p:"柴桑",ps:"諸葛亮·東吳群臣",d:"諸葛亮赴吳，駁倒張昭等降曹之議，促成孫劉聯盟。"},
    {n:"借東風",y:"208",p:"赤壁",ps:"諸葛亮",d:"演義謂諸葛亮登壇借東風，助周瑜火攻（史書無此事）。"},
    {n:"華容道",y:"208",p:"華容",ps:"關羽·曹操",d:"曹操敗走華容，關羽念舊義釋之。"},
    {n:"單刀赴會",y:"215",p:"陸口",ps:"關羽·魯肅",d:"魯肅邀關羽赴會索荊州，關羽單刀過江，全身而退。"},
    {n:"水淹七軍",y:"219",p:"樊城",ps:"關羽·于禁",d:"關羽借漢水暴漲，擒于禁斬龐德，威震華夏。"},

    {t:"千里草，何青青；十日卜，不得生。",s:"京師童謠",f:"董卓之誅（192）",d:"「千里草」為董，「十日卜」為卓，預言董卓之死。"},
    {t:"代漢者，當塗高也。",s:"讖緯",f:"魏代漢（220）",d:"「塗高」解為「魏」，預示曹魏代漢。"},

    {t:"左龍右鳳，飛入西川。",s:"童謠",f:"龐統之死",d:"預言臥龍、鳳雛入川，鳳雛隕於落鳳坡。"},
    {t:"三馬同槽。",s:"曹操之夢",f:"司馬氏代魏",d:"曹操夢三馬同食一槽，疑為馬騰父子，實應司馬懿、司馬師、司馬昭。"},

  poems: [
    {ti:"臨江仙 · 滾滾長江東逝水",a:"楊慎（明）",x:"滾滾長江東逝水，浪花淘盡英雄。是非成敗轉頭空。青山依舊在，幾度夕陽紅。\n白髮漁樵江渚上，慣看秋月春風。一壺濁酒喜相逢。古今多少事，都付笑談中。",c:"毛宗崗本置於卷首，為全書定調，道盡興亡。"},
    {ti:"觀滄海",a:"曹操",x:"東臨碣石，以觀滄海。水何澹澹，山島竦峙。\n樹木叢生，百草豐茂。秋風蕭瑟，洪波湧起。\n日月之行，若出其中；星漢燦爛，若出其裏。",c:"北征烏桓歸途所作，氣象雄渾。"},
    {ti:"短歌行",a:"曹操",x:"對酒當歌，人生幾何！譬如朝露，去日苦多。\n慨當以慷，憂思難忘。何以解憂？唯有杜康。\n青青子衿，悠悠我心。但為君故，沉吟至今。",c:"演義於赤壁前宴飲時引之，顯曹操之雄心。"},
    {ti:"七步詩",a:"曹植",x:"煮豆持作羹，漉菽以為汁。\n萁在釜下燃，豆在釜中泣。\n本自同根生，相煎何太急？",c:"曹丕逼弟七步成詩，曹植應聲而作。"},
    {ti:"梁父吟",a:"諸葛亮（傳）",x:"步出齊城門，遙望蕩陰里。\n里中有三墳，累累正相似。\n問是誰家冢，田疆古冶子。",c:"諸葛亮躬耕南陽時好為《梁父吟》。"},
    {ti:"蜀相",a:"杜甫（唐）",x:"丞相祠堂何處尋，錦官城外柏森森。\n映階碧草自春色，隔葉黃鸝空好音。\n三顧頻煩天下計，兩朝開濟老臣心。\n出師未捷身先死，長使英雄淚滿襟。",c:"後世詠武侯之名篇。"},
    {ti:"念奴嬌 · 赤壁懷古",a:"蘇軾（宋）",x:"大江東去，浪淘盡，千古風流人物。\n故壘西邊，人道是，三國周郎赤壁。\n亂石穿空，驚濤拍岸，捲起千堆雪。",c:"以赤壁為背景抒懷，推尊周瑜。"},
    {ti:"赤壁",a:"杜牧（唐）",x:"折戟沉沙鐵未銷，自將磨洗認前朝。\n東風不與周郎便，銅雀春深鎖二喬。",c:"假設東風不來之歷史另一可能。"}

<script>
/* ============================================================
   六、路由與渲染
   ============================================================ */
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(g=>`
    <div class="navgroup">${g.g}</div>
    ${g.items.map(([k,t])=>`<div class="navitem" data-k="${k}">${t}</div>`).join("")}
  `).join("");
  nav.querySelectorAll('.navitem').forEach(el=>{
    el.addEventListener('click',()=>{ location.hash = el.dataset.k; });
  });
}
function render(){
  let k = (location.hash||'#overview').slice(1);
  if(!VIEW[k]) k='overview';
  document.getElementById('app').innerHTML = VIEW[k]();
  document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('on', el.dataset.k===k));
  window.scrollTo({top:0,behavior:'smooth'});
  if(k==='relation') initRelation();
  if(k==='map') drawMap();
  if(k==='stats') initStats();
  if(k==='editions') initEditionChart();
  if(k==='query') __qFill();
}

/* ---------- 關係網 ---------- */
function initRelation(){
  const scenes=[];
  DATA.relations.forEach(([s,p,o,l])=>{ if(l==='結義'||l==='兄弟'||l==='父子'||l==='夫妻'||l==='君臣'||l==='師徒'||l==='敵對'||l==='同盟'){ scenes.push({s,o,l}); } });
  const types=[...new Set(DATA.relations.map(r=>r[2]))];
  const fc=document.getElementById('relFilter');
  fc.innerHTML = `<span class="chip zhu" data-t="__all" style="cursor:pointer;">全部</span>` +
    types.map(t=>`<span class="chip" data-t="${t}" style="cursor:pointer;">${t}</span>`).join("");
  const chart = echarts.init(document.getElementById('relchart'));
  function draw(sel){
    const rs = DATA.relations.filter(r=>sel==='__all'||r[2]===sel);
    const nodes = {}; 
    rs.forEach(([s,p,o])=>{ nodes[s]=1; nodes[o]=1; });
    const names = Object.keys(nodes);
    const cats = [...new Set(names.map(n=>(personByName(n)||{}).f||"其他"))].map(f=>({name:f}));
    const catIdx = {}; cats.forEach((c,i)=>catIdx[c.name]=i);
    const catColor = {"蜀漢":"#9d2933","曹魏":"#1f4e5f","東吳":"#3f7a63","漢室":"#a9863f"};
    const opt = {
      tooltip:{},
      legend:{data:cats.map(c=>c.name),bottom:0,textStyle:{fontSize:12}},
      series:[{
        type:'graph', layout:'force', roam:true, draggable:true,
        label:{show:true,fontSize:12,color:'#231f1a'},
        force:{repulsion:280,edgeLength:[60,140],gravity:0.12},
        emphasis:{focus:'adjacency'},
        categories:cats.map(c=>({name:c.name,itemStyle:{color:catColor[c.name]||'#7a6f60'}})),
        data:names.map(n=>({name:n, symbolSize: 18+Math.min(14, relationOf(n).length*1.6), category:catIdx[(personByName(n)||{}).f||"其他"]||0, value:relationOf(n).length})),
        edges:rs.map(([s,p,o,l])=>({source:s,target:o,value:l,label:{show:false},lineStyle:{color:'#c9b995',width:1,curveness:0.08}})),
        lineStyle:{color:'#c9b995'}
      }]
    };
    chart.setOption(opt,true);
  }
  fc.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>{
    fc.querySelectorAll('.chip').forEach(x=>x.classList.remove('zhu'));
    el.classList.add('zhu'); draw(el.dataset.t);
  }));
  draw('__all');
  window.addEventListener('resize',()=>chart.resize());
}

/* ---------- 輿地圖 ---------- */
function drawMap(){
  const W=980,H=620,pad=40;
  const lngMin=104,lngMax=122,latMin=28,latMax=42;
  const X=lng=>pad+(lng-lngMin)/(lngMax-lngMin)*(W-2*pad);
  const Y=lat=>H-pad-(lat-latMin)/(latMax-latMin)*(H-2*pad);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:760px;display:block;">`;
  g += `<rect x="0" y="0" width="${W}" height="${H}" fill="rgba(255,253,247,.5)" rx="12"/>`;
  for(let lg=105;lg<=121;lg+=4){ g+=`<line x1="${X(lg)}" y1="${pad}" x2="${X(lg)}" y2="${H-pad}" stroke="rgba(120,100,70,.12)"/>`; g+=`<text x="${X(lg)}" y="${H-pad+16}" font-size="11" fill="#837666" text-anchor="middle">${lg}°E</text>`; }
  for(let lt=30;lt<=42;lt+=4){ g+=`<line x1="${pad}" y1="${Y(lt)}" x2="${W-pad}" y2="${Y(lt)}" stroke="rgba(120,100,70,.12)"/>`; g+=`<text x="${pad-6}" y="${Y(lt)+4}" font-size="11" fill="#837666" text-anchor="end">${lt}°N</text>`; }
  const col={"都城":"#9d2933","州郡":"#a9863f","城邑":"#3f7a63","郡":"#3f7a63","戰場":"#1f4e5f","關隘":"#5b4a7a"};
  DATA.places.forEach(p=>{
    const cx=X(p.lng), cy=Y(p.lat), c=col[p.ty]||"#7a6f60";
    g+=`<circle cx="${cx}" cy="${cy}" r="${p.ty==='都城'?7:4.5}" fill="${c}" opacity=".85"/>`;
    g+=`<text x="${cx+8}" y="${cy+4}" font-size="12" fill="#231f1a" style="font-family:'Songti SC',serif;">${p.n}</text>`;
  });
  g += `</svg>`;
  g += `<div class="flex flex-wrap gap-2 mt-3 px-2">` + Object.keys(col).filter(k=>k!=='郡').map(k=>`<span class="chip" style="background:${col[k]}1a;color:${col[k]};">● ${k}</span>`).join("") + `</div>`;
  document.getElementById('mapsvg').innerHTML = g;
}

/* ---------- 異文對勘 LCS ---------- */
function lcsDiff(a,b){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Uint8Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--){
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  }
  let i=0,j=0,out=[];
  while(i<n&&j<m){
    if(a[i]===b[j]){ out.push(['same',a[i]]); i++;j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ out.push(['del',a[i]]); i++; }
    else { out.push(['ins',b[j]]); j++; }
  }
  while(i<n){ out.push(['del',a[i]]); i++; }
  while(j<m){ out.push(['ins',b[j]]); j++; }
  return out;
}
function __diff(){
  const a=document.getElementById('vA').value;
  const b=document.getElementById('vB').value;
  const d=lcsDiff(a,b);
  document.getElementById('vOut').innerHTML = d.map(([t,c])=>{
    if(t==='same') return `<span class="diff-same">${esc(c)}</span>`;
    if(t==='del')  return `<span class="diff-del">${esc(c)}</span>`;
    return `<span class="diff-ins">${esc(c)}</span>`;
  }).join("");
}
function __diffDemo(){
  document.getElementById('vA').value="關羽字雲長，河東解良人也。身長九尺，髯長二尺。";
  document.getElementById('vB').value="關某字雲長，河東解縣人也。身長九尺，髯長一尺八寸，面如重棗。";
  __diff();
}

/* ---------- 本體查詢 ---------- */
const Q_FIELDS = {
  persons:[["n","姓名"],["z","字"],["f","勢力"],["title","官爵"],["b","生年"],["d","卒年"]],
  battles:[["n","戰役"],["y","年代"],["p","地點"],["a","交戰方"],["r","結果"]],
  places:[["n","地名"],["m","今地"],["ty","類型"],["lat","緯度"],["lng","經度"]],
  stratagems:[["n","計謀"],["u","施計者"],["t","對象"]],
  artifacts:[["n","器物"],["o","持用者"]]
};
function __qFill(){
  const ent=document.getElementById('qEnt').value;
  const fs=Q_FIELDS[ent];
  document.getElementById('qField').innerHTML = fs.map(([k,t])=>`<option value="${k}">${t}</option>`).join("");
  __qRun();
}
function __qRun(){
  const ent=document.getElementById('qEnt').value;
  const field=document.getElementById('qField').value;
  const kw=document.getElementById('qKw').value.trim();
  const fs=Q_FIELDS[ent];
  document.getElementById('qSql').textContent = `SELECT * FROM ${ent}` + (kw?` WHERE ${field} LIKE '%${kw}%'`:'') + ` ORDER BY ${fs[0][0]}`;
  let rows=DATA[ent]||[];
  if(kw) rows=rows.filter(r=>String(r[field]||'').includes(kw));
  document.getElementById('qHead').innerHTML = `<tr>${fs.map(f=>`<th>${f[1]}</th>`).join("")}</tr>`;
  document.getElementById('qBody').innerHTML = rows.length
    ? rows.map(r=>`<tr>${fs.map(f=>`<td>${esc(r[f[0]])||"—"}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${fs.length}" class="sub">無匹配結果</td></tr>`;
}
