name: Deploy Romance-of-the-Three-Kingdoms to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# 仅允许一次并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 校验：pages build/deploy 权限不足时提前失败
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages permission
        uses: actions/github-script@v7
        with:
          script: |
            const permitted = await github.rest.actions.getGithubActionsPermissions({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            if (permitted.data.workflow['enabled'] !== true) {
              core.setFailed('Actions must be enabled to build and deploy GitHub Pages')
            }
            if (permitted.data.pages['enabled'] !== true) {
              core.setFailed('Pages must be enabled to build and deploy GitHub Pages')
            }

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4