const T2S = {'關':'关','張':'张','劉':'刘','諸':'诸','趙':'赵','馬':'马','黃':'黄','龐':'庞','孫':'孙','權':'权','魯':'鲁','呂':'吕','陸':'陆','顧':'顾','寧':'宁','統':'统','蓋':'盖','韓':'韩','蔣':'蒋','費':'费','禕':'祎','鄧':'邓','鍾':'钟','顏':'颜','醜':'丑','遼':'辽','詡':'诩','維':'维','會':'会','師':'师','騰':'腾','岱':'岱','遂':'遂','琦':'琦','琮':'琮','瑁':'瑁','越':'越','璋':'璋','嚴':'严','寶':'宝','進':'进','紹':'绍','術':'术','紀':'纪','靈':'灵','勳':'勋','楊':'杨','傕':'傕','儒':'儒','雄':'雄','濟':'济','宮':'宫','順':'顺','霸':'霸','蟬':'蝉','祖':'祖','蔡':'蔡','蒯':'蒯','禪':'禅','讖':'谶','譙':'谯','鄧':'邓','陸':'陆','遜':'逊','堅':'坚','策':'策','皓':'皓','叡':'睿','奐':'奂','邕':'邕','衡':'衡','禰':'祢','許':'许','攸':'攸','郃':'郃','瓊':'琼','惇':'惇','淵':'渊','晃':'晃','遼':'辽','遼':'辽','維':'维','緒':'绪','誕':'诞','欽':'钦','儉':'俭','誕':'诞','表':'表','琦':'琦','琮':'琮','祖':'祖','瑁':'瑁','越':'越','璋':'璋','松':'松','正':'正','權':'权','嚴':'严','顏':'颜','良':'良','醜':'丑','郃':'郃','覽':'览','配':'配','圖':'图','豐':'丰','授':'授','譚':'谭','尚':'尚','熙':'熙','幹':'干'};
function normName(s){ return String(s||'').split('').map(c=>T2S[c]||c).join(''); }
function personIdByName(name){ const n=normName(name); const p=data.persons.find(x=>normName(x.name)===n); return p?p.id:null; }

if(TOP.relationsExtra){
  for(const r of TOP.relationsExtra){
    const s=personIdByName(r.subjectName), o=personIdByName(r.objectName);
    if(s&&o) relations.push({subject:s, predicate:r.predicate, object:o});
  }
}
if(TOP.historical) historicalContrast.push(...TOP.historical);
if(TOP.commentsExtra) comments.push(...TOP.commentsExtra);
if(TOP.variantsExtra) variants.push(...TOP.variantsExtra);
if(TOP.stratagems) stratagems.push(...TOP.stratagems);
if(TOP.poems) poems.push(...TOP.poems);
if(TOP.prophecies) prophecies.push(...TOP.prophecies);
const eventsData = (TOP.events||[]);
const artifactsData = (TOP.artifacts||[]);
const factionsData = (TOP.factions||[]);
const editionsExtra = (TOP.editionsExtra||[]);
function uniqInPlace(arr, keyFn){
  const map=new Map();
  for(const x of arr) map.set(keyFn(x), x);
  arr.length=0; arr.push(...map.values());
}
uniqInPlace(stratagems, s=>s.name);
uniqInPlace(poems, p=>p.title);
uniqInPlace(prophecies, p=>p.content);
uniqInPlace(comments, c=>c.commenter+'|'+c.chapter+'|'+String(c.text).slice(0,24));
uniqInPlace(variants, v=>v.chapter+'|'+v.item);

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

// LCS 比对算法
function lcsDiff() {
  const a = document.getElementById('textA').value;
  const b = document.getElementById('textB').value;
  if(!a||!b) return alert('請輸入兩段文本');
  const m=a.length, n=b.length;
  const dp = Array(m+1).fill(0).map(()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++) dp[i][j] = a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  let i=m,j=n; const common=[];
  while(i>0&&j>0){ if(a[i-1]===b[j-1]){common.push(a[i-1]);i--;j--;} else if(dp[i-1][j]>dp[i][j-1]) i--; else j--; }
  const commonStr=common.reverse().join('');
  const strip=(s)=>{ let out='',k=0; for(const ch of s){ if(k<commonStr.length&&ch===commonStr[k]){k++;continue;} out+=ch; } return out; };
  const esc=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  document.getElementById('diff-result').classList.remove('hidden');
  document.getElementById('diff-result').innerHTML = '<div class="mb-2"><span class="text-[#8b0000]">【A獨有】</span><br>'+esc(strip(a))+'</div><div><span class="text-[#006400]">【B獨有】</span><br>'+esc(strip(b))+'</div>';
}

    const idMap = {};
    persons.forEach(p=>idMap[p.id]=p.name);
    const colorMap = {"蜀漢":"#2563eb","曹魏":"#dc2626","東吳":"#16a34a","群雄":"#6b7280","漢室":"#9333ea","黃巾":"#ca8a04","方士":"#7c3aed","隱士":"#7c3aed","名士":"#7c3aed","董卓集團":"#6b7280","呂布集團":"#6b7280","劉璋集團":"#6b7280","蜀漢宦官":"#2563eb","袁紹集團":"#6b7280","袁術集團":"#6b7280","荊州劉表":"#6b7280","西涼馬騰韓遂":"#6b7280","司馬晉":"#3a3a5a"};
    const catNames=Object.keys(colorMap);
    const nodes = persons.map(p=>{ const c=p.faction.split('→')[0]; return {name:p.name, symbolSize: Math.min(34, p.mentionCount/60 + 10), itemStyle:{color:colorMap[c]||'#6b7280'}, category: Math.max(0, catNames.indexOf(c))}; });
    const links = relations.filter(r=>idMap[r.subject]&&idMap[r.object]).map(r=>({source:idMap[r.subject], target:idMap[r.object], value:r.predicate, label:{show:false}}));
    chart.setOption({
      tooltip:{formatter:p=>p.dataType==='edge'?(p.data.source+' — '+p.data.value+' → '+p.data.target):(p.name+'（'+(catNames[p.category]||'')+'）')},
      series:[{type:'graph', layout:'force', roam:true, data:nodes, links:links, categories:catNames.map(n=>({name:n})), force:{repulsion:220, edgeLength:[50,160]}, label:{show:true, position:'right', fontSize:11}, lineStyle:{opacity:0.45}}]
    });
    window.addEventListener('resize',()=>chart.resize());
  }, 100);
}

// 本体查询
function renderQuery(el) {
  el.innerHTML = `<div class="max-w-4xl mx-auto"><h1 class="text-2xl font-bold ink-title pb-2 mb-4">本體查詢</h1><p class="text-sm text-[#8b6914] mb-4">選擇實體類型與屬性進行過濾查詢。</p>
    <div class="ancient-border p-4 rounded mb-4 flex gap-3 items-center flex-wrap">
      <label class="font-bold">查詢類：</label>
      <select id="query-class" class="border border-[#c9b896] rounded px-2 py-1" onchange="runQuery()">
        <option value="persons">人物</option><option value="places">地理</option><option value="battles">戰役</option>
      </select>
      <label class="font-bold">按勢力：</label>
      <select id="query-faction" class="border border-[#c9b896] rounded px-2 py-1" onchange="runQuery()">
        <option value="">全部</option><option value="蜀漢">蜀漢</option><option value="曹魏">曹魏</option><option value="東吳">東吳</option><option value="群雄">群雄</option>
      </select>
    </div>
    <div id="query-result"></div>
  </div>`;
  setTimeout(runQuery, 100);
}
function runQuery() {
  const cls = document.getElementById('query-class').value;
  const faction = document.getElementById('query-faction').value;
  let items = data[cls];
  if(faction && cls==='persons') items = items.filter(p=>p.faction.startsWith(faction));
  document.getElementById('query-result').innerHTML = `<table><thead><tr><th>名稱</th><th>屬性1</th><th>屬性2</th><th>屬性3</th></tr></thead><tbody>${items.slice(0,50).map(item=>`<tr><td class="font-bold">${item.name}</td><td>${item.style||item.level||item.year||'-'}</td><td>${item.faction||item.modernLocation||item.result||'-'}</td><td>${item.title||item.coord?.join?.(',')||item.keyPersons?.slice?.(0,3).join('、')||'-'}</td></tr>`).join('')}</tbody></table>`;
}

// 统计谱
function renderStatistics(el) {
  el.innerHTML = `<div class="max-w-6xl mx-auto"><h1 class="text-2xl font-bold ink-title pb-2 mb-4">統計譜</h1><div class="grid grid-cols-2 gap-4">
    <div class="ancient-border p-4 rounded"><div id="chart1" style="height:350px"></div></div>
    <div class="ancient-border p-4 rounded"><div id="chart2" style="height:350px"></div></div>
    <div class="ancient-border p-4 rounded col-span-2"><div id="chart3" style="height:300px"></div></div>
  </div></div>`;
  setTimeout(()=>{
    const factionCounts = {"蜀漢":0,"曹魏":0,"東吳":0,"群雄/其他":0};
    data.persons.forEach(p=>p.faction.startsWith('蜀漢')?factionCounts['蜀漢']++:p.faction.startsWith('曹魏')?factionCounts['曹魏']++:p.faction.startsWith('東吳')?factionCounts['東吳']++:factionCounts['群雄/其他']++);
    echarts.init(document.getElementById('chart1')).setOption({title:{text:'人物勢力分佈',left:'center'},series:[{type:'pie',radius:['40%','70%'],data:Object.entries(factionCounts).map(([k,v])=>({name:k,value,v})),label:{formatter:'{b}: {c}人'}}]});
    const topPersons = [...data.persons].sort((a,b)=>b.mentionCount-a.mentionCount).slice(0,10);
    echarts.init(document.getElementById('chart2')).setOption({title:{text:'人物提及次數TOP10',left:'center'},xAxis:{type:'category',data:topPersons.map(p=>p.name),axisLabel:{rotate:30}},yAxis:{type:'value'},series:[{type:'bar',data:topPersons.map(p=>p.mentionCount),itemStyle:{color:'#8b0000'}}]});
    const battleYears = {};
    data.battles.forEach(b=>{const y=parseInt(b.year);if(y>=184&&y<=280)battleYears[y]=(battleYears[y]||0)+1;});
    const yearData = Object.entries(battleYears).sort((a,b)=>a[0]-b[0]);
    echarts.init(document.getElementById('chart3')).setOption({title:{text:'重大戰役時間分佈（公元年）',left:'center'},xAxis:{type:'category',data:yearData.map(d=>d[0])},yAxis:{type:'value',name:'戰役數'},series:[{type:'line',data:yearData.map(d=>d[1]),smooth:true,itemStyle:{color:'#8b4513'},areaStyle:{color:'#f0e6d2'}}]});
  },100);
}
