# ============================================================
# 《三國演義》本體論受控詞表 v3.1
# 對應 sanguo_kg_ontology.ttl，所有枚舉值與 owl:NamedIndividual 對齊。
# 可直接用於前端搜索、數據錄入校驗、本體推理。
# ============================================================

# ---------- 1. 版本族系 ----------
version_family:
  yanyi:
    label: 演義系統（24 卷本）
    description: 以嘉靖壬午本為代表，24 卷 240 則單題，文字較近羅貫中原本面貌
    members: [jiajing, zhouyuexiao, xiazhenyu]
  zhizhuan:
    label: 志傳系統（20 卷本）
    description: 建陽書坊刻本群，獨有花關索故事，上圖下文，葉逢春本為首
    members: [yefengchun, yuxiangdou, huangzhengfu, liulongtian, zhudingchen]
  pingdian:
    label: 評點改造本（120 回本）
    description: 明末清初評點家合 240 則為 120 回，增加評點，改寫文字
    members: [lizhuowu, zhongbojing, liyu, maozonggang]
  modern:
    label: 現代整理本
    description: 現代學者校點/校注/校理本
    members: [renwen, shenbojun, zhonghua_huiping]
  sequel:
    label: 續書衍生
    description: 續三國/反三國/後三國等
    members: [fan, xu, hou]

# ---------- 2. 版本個體 ----------
editions:
  jiajing:
    id: sg_version_jiajing
    name: 嘉靖壬午本《三國志通俗演義》
    short: 嘉靖本
    family: yanyi
    year: 1522
    publisher: 明嘉靖元年刻本
    survival: 全本（影印存世）
    chapters: 24 卷 240 則
    has_fulltext: False
    feature: 現存最早刻本；240 則單題七言；尊曹傾向明顯；無《臨江仙》開篇；曹操形象未被臉譜化；含「孔明燒魏延於上方谷」等被毛本刪去之段落。
  zhouyuexiao:
    id: sg_version_zhouyuexiao
    name: 周曰校本《新刊校正古本大字音釋三國志通俗演義》
    short: 周曰校本
    family: yanyi
    year: 1591
    publisher: 明萬曆十九年金陵周曰校萬卷樓刊
    survival: 全本（有影印，識典古籍在線）
    chapters: 12 卷 240 則
    has_fulltext: False
    feature: 演義系代表本；增補插圖、音注、釋義、考證；與嘉靖本同屬演義系統，文字高度一致。
  yefengchun:
    id: sg_version_yefengchun
    name: 葉逢春本《新刊通俗演義三國志傳》
    short: 葉逢春本
    family: zhizhuan
    year: 1548
    publisher: 明嘉靖二十七年建陽葉逢春刊
    survival: 殘本（分藏數館）
    chapters: 10 卷 240 段
    has_fulltext: False
    feature: 志傳系統最早刻本；獨有『花關索』四傳（出身/征西川/下荊州/認父）；上圖下文版式。
  yuxiangdou:
    id: sg_version_yuxiangdou
    name: 余象斗雙峰堂本《音釋補遺按鑑批點三國志傳》
    short: 余象斗本
    family: zhizhuan
    year: 1592
    publisher: 明萬曆二十年建陽余象斗雙峰堂刊
    survival: 全本（英國博物院/早稻田藏）
    chapters: 20 卷
    has_fulltext: False
    feature: 開『評林』本之風；余氏自加評點；葉逢春本系統繁本代表。
  huangzhengfu:
    id: sg_version_huangzhengfu
    name: 黃正甫本《新刻考訂按鑑通俗演義全像三國志傳》
    short: 黃正甫本
    family: zhizhuan
    year: 1623
    publisher: 明天啟三年閩建黃正甫刊
    survival: 全本（日本內閣文庫藏）
    chapters: 20 卷 240 則
    has_fulltext: False
    feature: 志傳系統簡本；文字極簡淨；與繁本（余象斗）孰先孰後學界仍有爭論（小川環樹等主簡本為先）。
  lizhuowu:
    id: sg_version_lizhuowu
    name: 李卓吾評本《李卓吾先生批評三國志》
    short: 李卓吾評本
    family: pingdian
    year: ~1607
    publisher: 明萬曆間吳觀明容與堂刊
    survival: 全本
    chapters: 120 回（首合 240 則為 120 回）
    has_fulltext: False
    feature: 首次將 240 則合併為 120 回；回目由單題改為雙題；葉晝偽託李贄評點；尊劉貶曹傾向加強。
  zhongbojing:
    id: sg_version_zhongbojing
    name: 鍾伯敬評本《鍾伯敬先生批評三國志》
    short: 鍾伯敬評本
    family: pingdian
    year: ~1627
    publisher: 明天啟間積慶堂刊
    survival: 全本
    chapters: 120 回
    has_fulltext: False
    feature: 繼李評本之評點系統；評語較李評簡潔；明末清初流傳較廣。
  liyu:
    id: sg_version_liyu
    name: 李笠翁評本《笠翁批評三國志》
    short: 李漁評本
    family: pingdian
    year: ~1670
    publisher: 清康熙間刊
    survival: 全本
    chapters: 120 回
    has_fulltext: False
    feature: 毛宗崗同時代之評本；李漁為清初戲曲大家；評點偏向小說結構與文法。
  maozonggang:
    id: sg_version_maozonggang
    name: 毛宗崗評本《四大奇書第一種——三國志演義》
    short: 毛本（通行本）
    family: pingdian
    year: 1679
    publisher: 清康熙十八年醉畊堂刊（毛綸、毛宗崗父子評改）
    survival: 全本（通行本）
    chapters: 120 回
    has_fulltext: True
    feature: 現今通行本；首冠楊慎《臨江仙·滾滾長江東逝水》；整頓回目為對偶聯語；刪改嘉靖本尊曹字句，強化尊劉貶曹；刪去『上方谷燒魏延』等段落；加毛氏回前總評、夾批；此本一出『一切舊本乃不復行』。本站在線全文即毛本（590,968 字）。
  renwen:
    id: sg_version_renwen
    name: 人民文學出版社校訂本
    short: 人文社本
    family: modern
    year: 1953
    publisher: 人民文學出版社（初版顧學頡等整理，1973 第三版）
    survival: 全本
    chapters: 120 回
    has_fulltext: False
    feature: 以毛本為底本，參照明嘉靖本、清一些評本校勘標點；大陸最通行現代整理本；國內發行量最大。
  shenbojun:
    id: sg_version_shenbojun
    name: 沈伯俊校理本《三國演義（新校理本）》
    short: 沈伯俊校理本
    family: modern
    year: 1992
    publisher: 江蘇古籍出版社/巴蜀書社多版
    survival: 全本
    chapters: 120 回
    has_fulltext: False
    feature: 當代三國權威沈伯俊以毛本為底本、參校多個明刊本之校理本；對毛本地理/官職/人物訛誤多所校正。
  fan:
    id: sg_version_fan
    name: 反三國演義（周大荒）
    short: 反三國
    family: sequel
    year: 1924
    publisher: 民國時期初刊
    survival: 全本
    chapters: 60 回
    has_fulltext: False
    feature: 續書/翻案之作；為蜀漢翻案，令劉備諸葛亮統一天下；結尾『薦杜預老將獻新謀』不同毛本。

# ---------- 3. 虛實標註 ----------
fictional_flag:
  0:
    label: 正史有載
    description: 《三國志》/《後漢書》/《資治通鑑》有明確記載，與小說大體一致
    examples: [官渡之戰, 赤壁之戰, 夷陵之戰, 諸葛亮北伐, 曹操, 劉備, 孫權]
  1:
    label: 正史有載·小說加工
    description: 正史有原型，但細節、動機、形象被小說家美化/醜化/神化
    examples: [三顧茅廬, 草船借箭(原為孫權), 溫酒斬華雄(原為孫堅), 刮骨療毒(醫者非華佗)]
  2:
    label: 純虛構
    description: 正史完全無載，為民間傳說或小說家原創
    examples: [桃園結義, 過五關斬六將, 諸葛亮祭東風, 三英戰呂布, 貂蟬連環計, 八陣圖困陸遜, 周倉, 關索]

# ---------- 4. 異文類型 ----------
variant_type:
  vt_typo:
    label: 訛字（形近/音近而誤）
    examples: [范彊→范疆, 舁→抬]
  vt_missing:
    label: 脫文（後本脫漏原文）
    examples: [嘉靖本『好英雄』被毛本刪去]
  vt_extra:
    label: 衍文（後本增字）
    examples: [毛本加《臨江仙》開篇, 『為成都王』]
  vt_rewrite:
    label: 改寫（文字潤色、對仗、語氣變動）
    examples: [『寧使』→『寧教』, 『阿斗』→『後主』]
  vt_poetry:
    label: 詩文增刪
    examples: [毛本大量加入唐詩宋詞與後人吊詩]
  vt_plot:
    label: 情節增刪
    examples: [毛本刪「上方谷燒魏延」, 華佗為關公刮骨(張冠李戴)]
  vt_commentary:
    label: 評點增刪
    examples: [毛宗崗回前總評、夾批、夾評]

